name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.local.yaml config --quiet
      - run: npx playwright install --with-deps chromium
      - run: HND_E2E_PRODUCTION=1 npm run test:e2e
